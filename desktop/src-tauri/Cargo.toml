[package]
name = "clinilog-desktop"
version = "0.1.0"
description = "Clinilog desktop app"
edition = "2021"
publish = false

[lib]
name = "clinilog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }
# Offline cache: plain SQLite (built from source, no extra tools) + app-level AES-256-GCM.
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri already uses (see `cargo tree -i webview2-com`), for PrintToPdf.
webview2-com = "0.39"
windows-core = "0.62"
# DPAPI protects the offline-cache key.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
