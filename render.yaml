# Render Blueprint for the Clinilog API (spec §9a).
# In Render: New → Blueprint → pick this repo. It creates the database and the web service.
#
# Plans:
# - Database: "basic-256mb", Render's smallest paid plan. Free databases are deleted after
#   30 days and a workspace can only have one, so real clinic data needs a paid plan.
# - Web service: "free" sleeps when idle (the first request takes up to a minute; the app
#   shows "Connecting to server…"). Use "starter" or higher for everyday clinic use.

databases:
  - name: clinilog-db
    plan: basic-256mb
    region: singapore
    databaseName: clinilog
    user: clinilog
    postgresMajorVersion: "16"
    ipAllowList: [] # no outside access; the API connects over Render's private network

services:
  - type: web
    name: clinilog-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinilog-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_MINUTES
        value: "480"
      - key: RUST_LOG
        value: clinilog_server=info,tower_http=info
      # First admin's password. Render asks for it when the Blueprint is created.
      # On first start the server creates the school, this admin, sample sections and
      # medicines, and logs the school_id. Later starts skip seeding.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_USERNAME
        value: admin
      # The Clinilog superadmin, who approves subscription payments in the desktop app.
      # Password: 12+ characters with a letter and a number. Changing it signs the
      # superadmin out everywhere. Leave it empty to turn the superadmin login off.
      - key: SUPERADMIN_USERNAME
        value: superadmin
      - key: SUPERADMIN_PASSWORD
        sync: false
